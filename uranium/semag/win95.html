<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <base href="https://cdn.jsdelivr.net/gh/eazy-man/shHH@main/win95/">

    <link rel="manifest" href="manifest.json">

    <title>Win95</title>

    <script src="js-dos.js"></script>
</head>

<body>

<style>

body {
    background-image: url('bliss.png');
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    margin: 0;
    overflow: hidden;
}

#Progress {
    width: 100%;
    background-color: grey;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
}

#Bar {
    width: 0%;
    height: 30px;
    background-color: green;
    transition: width 0.05s linear;
}

button {
    visibility: hidden;
}

canvas {
    width: 100vw;
    height: 100vh;
}

</style>

<div id="Progress">
    <div id="Bar"></div>
</div>

<center>

    <canvas id="jsdos"></canvas>

    <br/>

    <button onclick="ci.fullscreen()">
        Fullscreen
    </button>

</center>

<script>

(() => navigator?.serviceWorker?.register?.('sw.js'))();

const CACHE_NAME = 'win95-cache-v1';

const CACHE_KEY = 'https://localcache/win95.zip';

const TOTAL_PARTS = 4;

async function fetchWithProgress(url, onProgress) {

    const res = await fetch(url + "?t=" + Date.now());

    console.log(
        url,
        res.status,
        res.headers.get('content-type')
    );

    if (!res.ok) {
        throw new Error(`Failed to fetch ${url}`);
    }

    const totalBytes =
        parseInt(res.headers.get('Content-Length')) || 0;

    const reader = res.body.getReader();

    let loadedBytes = 0;

    let chunks = [];

    while (true) {

        const { done, value } = await reader.read();

        if (done) break;

        chunks.push(value);

        loadedBytes += value.length;

        if (onProgress) {
            onProgress(loadedBytes, totalBytes);
        }
    }

    const combined = new Uint8Array(loadedBytes);

    let offset = 0;

    for (const chunk of chunks) {

        combined.set(chunk, offset);

        offset += chunk.length;
    }

    return combined;
}

async function getZip() {

    let zipBytes = null;

    try {

        const cache =
            await caches.open(CACHE_NAME);

        const cached =
            await cache.match(CACHE_KEY);

        if (cached) {

            console.log("Loading ZIP from cache");

            zipBytes =
                new Uint8Array(
                    await cached.arrayBuffer()
                );
        }

    } catch (e) {

        console.warn(
            "Cache read failed",
            e
        );
    }

    if (!zipBytes) {

        let loadedParts =
            new Array(TOTAL_PARTS).fill(0);

        let totalParts =
            new Array(TOTAL_PARTS).fill(0);

        function updateProgress() {

            const loaded =
                loadedParts.reduce((a, b) => a + b, 0);

            const total =
                totalParts.reduce((a, b) => a + b, 0);

            const pct =
                total > 0
                ? (loaded / total) * 100
                : 0;

            document.getElementById("Bar").style.width =
                Math.floor(pct) + "%";
        }

        const partPromises = [];

        for (let i = 1; i <= TOTAL_PARTS; i++) {

            const partName =
                `win95.zip.part${i}`;

            partPromises.push(

                fetchWithProgress(
                    partName,

                    (l, t) => {

                        loadedParts[i - 1] = l;

                        totalParts[i - 1] = t;

                        updateProgress();
                    }
                )
            );
        }

        const parts =
            await Promise.all(partPromises);

        console.log(
            "Downloaded parts:",
            parts.length
        );

        const totalLength =
            parts.reduce(
                (sum, p) => sum + p.length,
                0
            );

        zipBytes =
            new Uint8Array(totalLength);

        let offset = 0;

        for (const part of parts) {

            zipBytes.set(part, offset);

            offset += part.length;
        }

        console.log(
            "ZIP signature:",
            String.fromCharCode(
                zipBytes[0],
                zipBytes[1]
            )
        );

        try {

            const cache =
                await caches.open(CACHE_NAME);

            await cache.put(
                CACHE_KEY,
                new Response(zipBytes, {
                    headers: {
                        'Content-Type': 'application/zip'
                    }
                })
            );

        } catch (e) {

            console.warn(
                "Cache write failed",
                e
            );
        }
    }

    return zipBytes;
}

(async () => {

    const zipBytes =
        await getZip();

    const zipBlob =
        new Blob(
            [zipBytes],
            {
                type: "application/zip"
            }
        );

    const zipURL =
        URL.createObjectURL(zipBlob);

    Dos(
        document.getElementById("jsdos"),
        {
            autolock: true
        }

    ).ready((fs, main) => {

        fs.extract(zipURL).then(() => {

            document.getElementById("Bar").style.height =
                "0px";

            main([
                "-c",
                "imgmount d c.img",
                "-c",
                "boot c.img"

            ]).then((ci) => {

                window.ci = ci;

                document
                    .getElementsByTagName("button")[0]
                    .style.visibility = 'initial';

                ci.simulateKeyPress(32);

                document.title = "Win95";
            });
        });
    });

})();

</script>

</body>
</html>
