<!DOCTYPE html>
<html lang="en">
<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head>
<meta charset="utf-8">
<title></title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: black;
    color: #fedb1d;
    overflow: hidden;
}
#canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    width: auto;
    height: 100%;
    background: black;
    padding: 0;
    margin: 0;
    transform: translate(-50%, -50%);
}
.emularity-splash-screen {
    text-align: center;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 50%;
    margin: 0;
    box-sizing: border-box;
    color: #000;
}
</style>
</head>
<body>

<canvas id="canvas" style="width:50%;height:50%;display:block;margin:0 auto;" onclick="window.focus();"></canvas>

<script src="https://code.jquery.com/jquery-2.1.1.min.js"></script>

<script>
const CDN_BASE = "https://cdn.jsdelivr.net/gh/bubbls/dosbox/";
const LOCAL_BASE = location.origin + "/";

function loadScript(src){
    return new Promise(r=>{
        const s=document.createElement("script");
        s.src=src;
        s.onload=r;
        document.head.appendChild(s);
    });
}

function $_GET(param){
    var vars={};
    window.location.href.replace(location.hash,'').replace(/[?&]+([^=&]+)=?([^&]*)?/gi,function(m,key,value){vars[key]=value!==undefined?value:'';});
    if(param){return vars[param]?vars[param]:null;}
    return vars;
}

var softs={
    DOOM:{
        file:LOCAL_BASE+'roms/DOSBOX_TTYCOON.ZIP',
        cmd:'DOSBOX_TTYCOON/TYCOON.exe',
        pointer:true
    }
};

function startEmulator(){

    var file="DOOM";

    if($_GET('soft')!=null){
        if(softs[$_GET('soft')]!=undefined){
            file=$_GET('soft');
        }
    }

    if(softs[file].machine==undefined){

        function locateAdditionalFiles(filename){
            if(filename==="dosbox.html.mem"){
                return CDN_BASE+"js/dosbox-sync.mem";
            }
            return CDN_BASE+"js/"+filename;
        }

        var dosbox=new Emulator(
            document.querySelector("#canvas"),
            null,
            new DosBoxLoader(
                DosBoxLoader.emulatorJS(CDN_BASE+"js/dosbox-sync.js"),
                DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
                DosBoxLoader.nativeResolution(640,400),
                DosBoxLoader.mountZip("c",
                    DosBoxLoader.fetchFile("Software",softs[file].file)
                ),
                DosBoxLoader.startExe(softs[file].cmd)
            )
        );

        dosbox.start({waitAfterDownloading:false});
    }

    if(softs[file].machine=='PC98'){

        function locateAdditionalFiles(filename){
            if(filename==="dosbox.html.mem"){
                return CDN_BASE+"js/dosbox-sync.mem";
            }
            return CDN_BASE+"js/"+filename;
        }

        var dosbox=new Emulator(
            document.querySelector("#canvas"),
            null,
            new PC98DosBoxLoader(
                PC98DosBoxLoader.emulatorJS(CDN_BASE+"js/dosbox-x.js"),
                PC98DosBoxLoader.emulatorWASM(CDN_BASE+"js/dosbox-x.wasm"),
                PC98DosBoxLoader.locateAdditionalEmulatorJS(locateAdditionalFiles),
                PC98DosBoxLoader.nativeResolution(640,480),
                PC98DosBoxLoader.mountZip("c",
                    PC98DosBoxLoader.fetchFile("Game File",softs[file].file)
                ),
                PC98DosBoxLoader.mountZip("y",
                    PC98DosBoxLoader.fetchFile("ROM File",CDN_BASE+"js/font.zip")
                ),
                PC98DosBoxLoader.startExe(softs[file].cmd)
            )
        );

        dosbox.start({waitAfterDownloading:true});
    }

    if(softs[file].pointer==false){
        var c=document.getElementById("canvas");
        c.style.cursor="none";
    }
}

(async function(){
    await loadScript(CDN_BASE+"js/es6-promise.js");
    await loadScript(CDN_BASE+"js/browserfs.min.js");
    await loadScript(CDN_BASE+"js/loader.js");
    startEmulator();
})();
</script>

</body>
</html>
