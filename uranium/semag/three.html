<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <base href="https://cdn.jsdelivr.net/gh/eazy-man/shHH@main/unity/three/">
    <title>Unity WebGL Player | THREE</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">THREE</div>
      </div>
    </div>
<script>
  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var fullscreenButton = document.querySelector("#unity-fullscreen-button");
  var warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(msg, type) {
    var div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);

    if (type === 'error') div.style = 'background:red;padding:10px;';
    else if (type === 'warning') div.style = 'background:yellow;padding:10px;';

    setTimeout(() => {
      if (warningBanner.contains(div)) {
        warningBanner.removeChild(div);
      }
    }, 5000);
  }

  var buildUrl = "Build";

  // ⚡ FAST PARALLEL LOADER (data + wasm)
  async function loadParts(base, count) {
    const parts = Array.from({ length: count }, (_, i) =>
      fetch(`${base}.part${i + 1}`).then(r => {
        if (!r.ok) throw new Error(`Missing file: ${base}.part${i + 1}`);
        return r.arrayBuffer();
      })
    );

    const buffers = await Promise.all(parts);

    return new Blob(buffers);
  }

  var config = {
    streamingAssetsUrl: "StreamingAssets",
    companyName: "amongzac",
    productName: "THREE",
    productVersion: "1",
    showBanner: unityShowBanner,
  };

  loadingBar.style.display = "block";

  // Load loader FIRST
  var loaderScript = document.createElement("script");
  loaderScript.src = `${buildUrl}/three.loader.js`;

  loaderScript.onload = async () => {
    try {
      const dataBlob = await loadParts(`${buildUrl}/three.data`, 4);
      const wasmBlob = await loadParts(`${buildUrl}/three.wasm`, 2);

      config.dataUrl = URL.createObjectURL(dataBlob);
      config.codeUrl = URL.createObjectURL(wasmBlob);
      config.frameworkUrl = `${buildUrl}/three.framework.js`;

      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (progress * 100) + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";

        fullscreenButton.onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });

    } catch (err) {
      console.error(err);
      alert(err.message || err);
    }
  };

  document.body.appendChild(loaderScript);
</script>
  </body>
</html>
