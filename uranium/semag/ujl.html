<html>
  <body style="margin:0;background:#000">
    <div id="game" style="width:100%;height:100%"></div>
    <script>
      (async () => {
        const base = "https://rawcdn.githack.com/eazy-man/shHH/refs/heads/main/corners/um-jammer-lammy-usa.chd.part";
        const total = 6;

        const parts = await Promise.all(
          Array.from({ length: total }, (_, i) =>
            fetch(base + (i + 1))
              .then(r => r.arrayBuffer())
          )
        );

        const totalSize = parts.reduce((s, b) => s + b.byteLength, 0);
        const merged = new Uint8Array(totalSize);
        let offset = 0;
        for (const b of parts) {
          merged.set(new Uint8Array(b), offset);
          offset += b.byteLength;
        }

        const blobUrl = URL.createObjectURL(new Blob([merged]));

        EJS_player = "#game";
        EJS_core = "psx";
        EJS_gameName = "Um Jammer Lammy";
        EJS_color = "#0064ff";
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        EJS_gameUrl = blobUrl;

        const s = document.createElement("script");
        s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
